[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-chat-fastapi"
version = "0.1.0"
description = "In-memory FastAPI backend for managing GenAI chat sessions and messages"
requires-python = ">=3.11"
dependencies = ["fastapi[standard]>=0.115"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "mypy>=1.11", "ruff>=0.6"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true
